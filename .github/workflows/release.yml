name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Raw "src/SosLan/SosLan.csproj"
          if ($content -match '<Version>([\d\.]+)</Version>') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish src/SosLan/SosLan.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:DebugType=None `
            -o publish

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SOS-LAN v${{ steps.version.outputs.version }}
          files: publish/SosLan.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
